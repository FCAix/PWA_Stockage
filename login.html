<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="stylesheet" href="./styles.css">

    <title>Connexion</title>

    <script
        type="module"
        src="./js/login.js"
    ></script>
</head>

<body>

    <main class="login-container">

        <h1>Connexion</h1>

        <form id="login-form">

            <label for="email">
                Adresse e-mail
            </label>

            <input
                id="email"
                type="email"
                required
            >

            <label for="password">
                Mot de passe
            </label>

            <input
                id="password"
                type="password"
                required
            >

            <button type="submit">
                Se connecter
            </button>

            <p>
                Pas encore de compte ?
                <a href="./registrer.html">
                    Créer un compte
                </a>
            </p>

            <p id="login-error"></p>

        </form>

    </main>

</body>

</html>
