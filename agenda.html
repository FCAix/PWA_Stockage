<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <link
        rel="manifest"
        href="./manifest.webmanifest"
    >

    <link
        rel="stylesheet"
        href="./styles.css"
    >

    <script
        type="module"
        src="./js/navigation.js"
    ></script>

    <title>Agenda du matériel</title>
</head>

<body>

    <header class="entete-page">

        <h1>Agenda du matériel</h1>

        <nav>

            <a href="./accueil.html">
                Accueil
            </a>

            <a href="./reservationMateriel.html">
                Nouvelle demande
            </a>

        </nav>

    </header>


    <main class="page-reservations">

        <label for="selection-materiel-agenda">
            Sélectionnez un matériel
        </label>

        <select id="selection-materiel-agenda">

            <option value="">
                Sélectionner un matériel
            </option>

        </select>


        <p
            id="message-agenda"
            role="status"
        ></p>


        <!--
            On garde aussi agenda-minibus afin de
            réutiliser le CSS existant.
        -->

        <section
            id="agenda-materiel"
            class="agenda-minibus agenda-materiel"
            hidden
        >

            <div class="navigation-agenda">

                <button
                    id="bouton-mois-precedent"
                    type="button"
                    aria-label="Mois précédent"
                >
                    ←
                </button>

                <h2 id="titre-mois-agenda"></h2>

                <button
                    id="bouton-mois-suivant"
                    type="button"
                    aria-label="Mois suivant"
                >
                    →
                </button>

            </div>


            <div class="entete-grille-agenda">

                <span>Lun</span>
                <span>Mar</span>
                <span>Mer</span>
                <span>Jeu</span>
                <span>Ven</span>
                <span>Sam</span>
                <span>Dim</span>

            </div>


            <div
                id="grille-agenda"
                class="grille-agenda"
            ></div>


            <section class="details-reservations">

                <h2>
                    Réservations du mois
                </h2>

                <div
                    id="liste-reservations-agenda"
                ></div>

            </section>

        </section>

    </main>


    <script
        type="module"
        src="./js/agendaMateriel.js"
    ></script>

</body>

</html>
