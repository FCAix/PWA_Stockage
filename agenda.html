<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <link
        rel="manifest"
        href="./manifest.webmanifest"
    >

    <link
        rel="stylesheet"
        href="./styles.css"
    >

    <script
        type="module"
        src="./js/navigation.js"
    ></script>

    <script
        type="module"
        src="./js/agendaReservations.js"
    ></script>

    <title>Agenda des réservations</title>

</head>


<body>

    <header class="entete-page">

        <h1>Agenda des réservations</h1>

        <nav>

            <a href="./reservation.html">
                Nouvelle demande
            </a>

            <a href="./mesDemandes.html">
                Mes demandes
            </a>

        </nav>

    </header>


    <main class="page-reservations">

        <label for="type-agenda">
            Type
        </label>

        <select id="type-agenda">

            <option value="">
                Choisir un type
            </option>

            <option value="materiel">
                Matériel
            </option>

            <option value="minibus">
                Minibus
            </option>

            <option value="tonnelle">
                Tonnelle
            </option>

        </select>


        <label for="selection-ressource-agenda">
            Élément
        </label>

        <select
            id="selection-ressource-agenda"
            disabled
        >

            <option value="">
                Choisissez d'abord un type
            </option>

        </select>


        <p
            id="message-agenda"
            role="status"
        ></p>


        <section
            id="agenda-reservations"
            class="agenda-minibus"
            hidden
        >

            <div class="navigation-agenda">

                <button
                    id="bouton-mois-precedent"
                    type="button"
                >
                    ←
                </button>

                <h2 id="titre-mois-agenda"></h2>

                <button
                    id="bouton-mois-suivant"
                    type="button"
                >
                    →
                </button>

            </div>


            <div class="entete-grille-agenda">

                <span>Lun</span>
                <span>Mar</span>
                <span>Mer</span>
                <span>Jeu</span>
                <span>Ven</span>
                <span>Sam</span>
                <span>Dim</span>

            </div>


            <div
                id="grille-agenda"
                class="grille-agenda"
            ></div>


            <section class="details-reservations">

                <h2>
                    Réservations du mois
                </h2>

                <div
                    id="liste-reservations-agenda"
                ></div>

            </section>

        </section>

    </main>

</body>

</html>
