<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Créer un compte</title>

    <link rel="stylesheet" href="./styles.css">

    <script
        type="module"
        src="./js/registrer.js">
    </script>
</head>

<body>

    <main class="login-container">

        <h1>Créer un compte</h1>

        <form id="register-form">

            <label for="full-name">
                Nom complet
            </label>

            <input
                id="full-name"
                type="text"
                autocomplete="name"
                required
            >

            <label for="email">
                Adresse e-mail
            </label>

            <input
                id="email"
                type="email"
                required
            >

            <label for="password">
                Mot de passe
            </label>

            <input
                id="password"
                type="password"
                minlength="6"
                required
            >

            <label for="password-confirm">
                Confirmer le mot de passe
            </label>

            <input
                id="password-confirm"
                type="password"
                minlength="6"
                required
            >

            <button type="submit">
                Créer mon compte
            </button>

            <p id="register-message"></p>

        </form>

        <a href="./login.html">
            J'ai déjà un compte
        </a>

    </main>

</body>
</html>
